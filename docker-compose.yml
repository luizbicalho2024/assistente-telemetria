services:
  mongo:
    image: mongo:8.0
    container_name: assistente-telemetria-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-TroqueRootMongo123!}
      MONGO_APP_DATABASE: ${MONGODB_DATABASE:-assistente_telemetria}
      MONGO_APP_USER: ${MONGO_APP_USER:-assistente}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-TroqueMongoAgora123!}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - assistente

  assistente:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistente-telemetria-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Assistente Telemetria}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_CONNECTION: mongodb
      MONGODB_URI: "mongodb://${MONGO_APP_USER:-assistente}:${MONGO_APP_PASSWORD:-TroqueMongoAgora123!}@mongo:27017/${MONGODB_DATABASE:-assistente_telemetria}?authSource=${MONGODB_DATABASE:-assistente_telemetria}"
      MONGODB_DATABASE: ${MONGODB_DATABASE:-assistente_telemetria}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TroqueEstaSenha123!}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    networks:
      - assistente

volumes:
  mongo_data:
    name: assistente_telemetria_mongo_data

networks:
  assistente:
    name: assistente_telemetria_network
