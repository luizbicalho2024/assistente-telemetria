name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff hygiene
        run: git diff --check

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

      - name: Build hardened image with dev dependencies
        run: docker build --build-arg INSTALL_DEV=true -t assistente-telemetria-ci .

      - name: Unit tests
        run: docker run --rm --entrypoint php assistente-telemetria-ci artisan test --testsuite=Unit
